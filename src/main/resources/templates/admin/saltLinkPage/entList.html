<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('食盐定点企业总名录')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">企业类别</label>
                <div class="layui-input-inline">
                    <select name="siteType">
                        <option value="">全部类别</option>
                        <option value="制盐企业">制盐企业</option>
                        <option value="省内批发企业">省内批发企业</option>
                        <option value="跨省批发企业">跨省批发企业</option>
                    </select>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="ent-query">
                    <i class="layui-icon layui-icon-search"></i> 查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i> 重置
                </button>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="ent-table" lay-filter="ent-table"></table>
    </div>
</div>

<script type="text/html" id="ent-status-tpl">
    {{#  if(d.status === 1){ }}<span class="pear-text pear-text-warning">已摘牌（旧页仍在册）</span>
    {{#  } else { }}<span class="pear-text pear-text-success">在册</span>{{#  } }}
</script>

<script type="text/html" id="ent-bar">
    {{#  if(d.status === 1){ }}
    <button shiro:hasPermission="salt:saltLinkPage:edit" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="resume">恢复在册</button>
    {{#  } else { }}
    <button shiro:hasPermission="salt:saltLinkPage:edit" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="delist">停用（摘牌）</button>
    {{#  } }}
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/SaltLinkPageController/";

        table.render({
            elem: '#ent-table',
            url: MODULE_PATH + 'entList',
            method: 'get',
            page: false,
            skin: 'line',
            // 服务层已按 制盐企业→省内批发企业→跨省批发企业 的次序排好
            cols: [[
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '企业代号', field: 'siteNo', align: 'center', width: 120},
                {title: '企业全称', field: 'siteName', align: 'center'},
                {title: '企业类别', field: 'siteType', align: 'center', width: 150},
                {title: '属地那一路（省—市—县）', field: 'roadName', align: 'center', width: 240},
                {title: '名录情形', field: 'status', align: 'center', width: 200, templet: '#ent-status-tpl'},
                {title: '操作', toolbar: '#ent-bar', align: 'center', width: 140}
            ]],
            parseData: function (res) {
                return {code: res.code, msg: res.msg, count: (res.data || []).length, data: res.data};
            }
        });

        form.on('submit(ent-query)', function (data) {
            // 显式带 siteType（含空串），否则从某类别切回"全部"时旧条件被 reload 合并残留
            table.reload('ent-table', {where: {siteType: data.field.siteType || ''}});
            return false;
        });

        // 停用（摘牌）/恢复都在总名录这一个口子上改；起页那头只认这个状态
        table.on('tool(ent-table)', function (obj) {
            let toStatus = obj.event === 'delist' ? 1 : 0;
            let tip = toStatus === 1
                ? '停用后该企业不再开新页，已有的旧页仍在册、仍可查，确定停用？'
                : '确定恢复为在册？恢复后可继续起新页。';
            layer.confirm(tip, {icon: 3, title: '提示'}, function (index) {
                layer.close(index);
                $.ajax({
                    url: MODULE_PATH + 'entStatus',
                    data: {id: obj.data.id, status: toStatus},
                    dataType: 'json', type: 'post',
                    success: function (r) {
                        layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2, time: 1300}, function () {
                            if (r.code === 200) {
                                // 名录是挂接页开的弹层；关掉本层，顺手刷新父页名单与名录页
                                table.reload('ent-table');
                                try { parent.layui.table.reload('link-page-table'); } catch (e) {}
                            }
                        });
                    }
                });
            });
        });
    });
</script>
</body>
</html>
