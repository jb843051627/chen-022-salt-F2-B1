<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('企业品种挂接簿页重挂')"/>
</head>
<body>
<form class="layui-form">
    <input type="hidden" name="id" th:value="${page?.id}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">所对定点企业</label>
                <div class="layui-input-block">
                    <select name="siteId" lay-verify="required" id="siteSelect">
                        <option value="">请选择总名录上的企业</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">挂靠那一层</label>
                <div class="layui-input-block">
                    <select name="nodeNo" lay-verify="required">
                        <option value="0" th:selected="${page?.nodeNo == 0}">省</option>
                        <option value="1" th:selected="${page?.nodeNo == 1}">市</option>
                        <option value="2" th:selected="${page?.nodeNo == null or page?.nodeNo == 2}">县</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">应挂品种数</label>
                <div class="layui-input-block">
                    <input type="number" min="0" step="1" name="shouldCount" autocomplete="off"
                           th:value="${page?.shouldCount}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">已挂品种数</label>
                <div class="layui-input-block">
                    <input type="number" min="0" step="1" name="doneCount" autocomplete="off"
                           th:value="${page?.doneCount}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">欠挂品种数</label>
                <div class="layui-input-block">
                    <!-- 只许看不许改：保存后系统按 应挂-已挂 重算写回 -->
                    <input type="text" class="layui-input" disabled
                           th:value="'现欠 ' + ${page?.lackCount} + '（保存时系统重算）'">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">挂接代号</label>
                <div class="layui-input-block">
                    <!-- 重挂不换代号；这两栏系统管，没有录入位 -->
                    <input type="text" class="layui-input" th:value="${page?.billNo}" disabled>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">随行签认码</label>
                <div class="layui-input-block">
                    <input type="text" class="layui-input" th:value="${page?.signCode}" disabled>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="${page?.remark}"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="page-save">
                <i class="layui-icon layui-icon-ok"></i> 重挂保存
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i> 重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    let CURRENT_SITE_ID = [[${page?.siteId}]];
</script>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/SaltLinkPageController";

        // 总名录都摆出来（含已摘牌的——它早前的页照旧查得着、照旧算在册）
        $.ajax({
            url: MODULE_PATH + '/entList', type: 'get', dataType: 'json',
            success: function (res) {
                let rows = res.data || [];
                let html = '<option value="">请选择总名录上的企业</option>';
                rows.forEach(function (e) {
                    let picked = String(e.id) === String(CURRENT_SITE_ID) ? ' selected' : '';
                    let tag = e.status === 1 ? '（已摘牌）' : '';
                    html += '<option value="' + e.id + '"' + picked + '>'
                        + e.siteNo + '｜' + e.siteName + tag + '｜' + e.siteType
                        + '｜' + e.roadName + '</option>';
                });
                $('#siteSelect').html(html);
                form.render('select');
            }
        });

        form.on('submit(page-save)', function (data) {
            let f = data.field;
            if (f.shouldCount === null || f.shouldCount === '') {
                layer.msg('应挂品种数那一栏空着，保存不了', {icon: 2});
                return false;
            }
            $.ajax({
                url: MODULE_PATH + '/edit',
                data: f, dataType: 'json', type: 'post',
                success: function (result) {
                    if (result.code === 200) {
                        layer.msg(result.msg, {icon: 1, time: 1200}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload('link-page-table');
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2000});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
